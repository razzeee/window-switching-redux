name: Test and Package

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and package extension
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Node tests
        run: npm test
      - name: Install packaging tool
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gnome-shell
      - name: Build extension ZIP
        run: npm run pack
      - name: Check archive integrity and list contents
        run: |
          unzip -t dist/*.shell-extension.zip
          unzip -l dist/*.shell-extension.zip
      - name: Upload extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: shell-extension
          path: dist/*.shell-extension.zip
          if-no-files-found: error

  release:
    name: Attach ZIP to release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shell-extension
          path: dist
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.shell-extension.zip --clobber
